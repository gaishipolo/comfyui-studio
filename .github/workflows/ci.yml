name: CI

# 每次 push 到 main 和每个 PR 都跑，手动也可以在 Actions 页面点一下。
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# 同一分支连续 push 时取消上一次未跑完的，省额度也省等待
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── 后端：44 个不依赖 pytest 的裸脚本，逐个独立进程跑 ──────────────
  backend:
    name: backend / py3.13
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt

      - name: 安装依赖（含 lint 工具）
        run: pip install -r requirements-dev.txt

      # 只检查 git 跟踪的 .py。两个原因：
      #   plugins/ 目录运行时可被写入管理员上传的第三方插件 —— 那是别人的代码，
      #     不该由我们的门禁拦下（也不该让它把 CI 弄红）
      #   tests/ 里刻意构造脏数据用来验证清洗逻辑，E402 之类是必然的
      # git ls-files 输出相对当前目录的路径，在 backend/ 下正好对应磁盘布局
      - name: lint
        run: ruff check $(git ls-files '*.py' | grep -v '^tests/')

      # 不用 `set -e` 逐个中断：让一次构建把所有失败都报出来，
      # 否则每修一个就要再 push 一次才能看到下一个。
      - name: 运行全部后端测试
        run: |
          total=0
          failed=()
          for f in tests/test_*.py; do
            total=$((total + 1))
            name=$(basename "$f")
            if python "$f" > "/tmp/$name.log" 2>&1; then
              echo "PASS  $name"
            else
              echo "FAIL  $name"
              failed+=("$name")
            fi
          done

          if [ ${#failed[@]} -ne 0 ]; then
            for name in "${failed[@]}"; do
              echo ""
              echo "════════ 失败详情：$name ════════"
              cat "/tmp/$name.log"
            done
            echo ""
            echo "通过 $((total - ${#failed[@]})) / $total，失败 ${#failed[@]} 个：${failed[*]}"
            exit 1
          fi
          echo "通过 $total / $total"

  # ── 前端：类型检查 + 构建 + 纯函数单测 ────────────────────────────
  frontend:
    name: frontend / node22
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: 安装依赖
        run: npm ci --no-audit --no-fund

      - name: lint
        run: npm run lint

      - name: 单测
        run: npm run test:state

      # build 里含 `tsc -b`：类型错误会在这里挂，不用另跑一次 tsc
      - name: 类型检查 + 构建
        run: npm run build
